<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Payment - EdenAura</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container py-5">
        <h1 class="mb-4">Payment Page</h1>
        <p>This is a placeholder for the payment gateway integration.</p>
        <p>Please implement your payment processing here.</p>
        <a href="index.html" class="btn btn-primary mt-3">Back to Home</a>
    </div>

    <div id="footer-placeholder"></div>

    <!-- Cart Modal Start -->
    <div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="cartModalLabel">Your Cart</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div id="cartItemsContainer">
              <!-- Cart items will be dynamically inserted here -->
            </div>
            <div class="mt-3 text-end">
              <strong>Total: $<span id="cartTotal">0.00</span></strong>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Continue Shopping</button>
            <button type="button" class="btn btn-primary" id="checkoutBtn">Checkout</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Cart Modal End -->

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/main.js"></script>

    <script>
        // Load header and footer components dynamically
        function loadComponent(id, url) {
            fetch(url)
                .then(response => response.text())
                .then(data => {
                    document.getElementById(id).innerHTML = data;
                })
                .catch(error => console.error('Error loading component:', error));
        }

        loadComponent('header-placeholder', 'components/header.html');
        loadComponent('footer-placeholder', 'components/footer.html');
    </script>
</body>
</html>
