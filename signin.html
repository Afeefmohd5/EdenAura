<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Sign In - EdenAura</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <!-- Spinner Start -->
    <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    </div>
    <!-- Spinner End -->

    <!-- Navbar Start -->
    <nav class="navbar navbar-expand-lg bg-white navbar-light sticky-top p-0">
        <a href="index.html" class="navbar-brand d-flex align-items-center px-4 px-lg-5">
            <img style="height: 5rem;" src="img/Edenaura_png-01logo.png" alt="">
        </a>
        <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <div class="navbar-nav ms-auto p-4 p-lg-0">
                <a href="index.html" class="nav-item nav-link active">Home</a>
                <a href="about.html" class="nav-item nav-link">About</a>
                <a href="service.html" class="nav-item nav-link">Services</a>
                <a href="Products.html" class="nav-item nav-link">Products</a>
                <a href="contact.html" class="nav-item nav-link">Contact</a>
                <a href="#" class="nav-item nav-link" data-bs-toggle="modal" data-bs-target="#userAuthModal">
                    <i class="fa fa-user"></i>
                </a>
                <a href="#" class="nav-item nav-link position-relative" data-bs-toggle="modal" data-bs-target="#cartModal">
                    <span id="cart-count" class="position-absolute badge rounded-pill bg-danger" style="font-size: 0.75rem; top: 1rem; right: 0.5rem;">0</span>
                    <i class="fa fa-shopping-cart"></i> Cart
                </a>
            </div>
        </div>
    </nav>
    <!-- Navbar End -->

    <!-- User Authentication Modal Start -->
    <div class="modal fade" id="userAuthModal" tabindex="-1" aria-labelledby="userAuthModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="userAuthModalLabel">Sign In</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="loginFormContainer">
                        <form id="signInForm">
                            <div class="mb-3">
                                <label for="signInMobile" class="form-label">Mobile Number</label>
                                <input type="tel" class="form-control" id="signInMobile" required pattern="[0-9]{10}" maxlength="10" placeholder="e.g. 9876543210">
                            </div>
                            <div class="mb-3">
                                <label for="signInPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="signInPassword" required>
                            </div>
                            <div id="signInError" class="text-danger mb-3" style="display:none;">Invalid mobile number or password.</div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                        <div class="mt-3 text-center">
                            <span>New user? <a href="#" id="showSignUpForm">Create account</a></span>
                        </div>
                    </div>
                    <div id="signUpFormContainer" style="display:none;">
                        <form id="signUpForm">
                            <div class="mb-3">
                                <label for="signUpUsername" class="form-label">Username</label>
                                <input type="text" class="form-control" id="signUpUsername" required>
                            </div>
                            <div class="mb-3">
                                <label for="signUpEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="signUpEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="signUpMobile" class="form-label">Mobile Number</label>
                                <input type="tel" class="form-control" id="signUpMobile" required pattern="[0-9]{10}" maxlength="10">
                            </div>
                            <div class="mb-3">
                                <label for="signUpPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="signUpPassword" required>
                            </div>
                            <div class="mb-3">
                                <label for="signUpConfirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="signUpConfirmPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Create Account</button>
                        </form>
                        <div class="mt-3 text-center">
                            <span>Already have an account? <a href="#" id="showSignInForm">Sign in</a></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- User Authentication Modal End -->

    <!-- JS -->
    <script src="js/main.js"></script>
    <script>
        $(document).ready(function() {
            if (typeof updateCartCount === 'function') {
                updateCartCount();
            }
        });

        document.getElementById("showSignUpForm").addEventListener("click", function (e) {
            e.preventDefault();
            document.getElementById("loginFormContainer").style.display = "none";
            document.getElementById("signUpFormContainer").style.display = "block";
        });

        document.getElementById("showSignInForm").addEventListener("click", function (e) {
            e.preventDefault();
            document.getElementById("signUpFormContainer").style.display = "none";
            document.getElementById("loginFormContainer").style.display = "block";
        });
    </script>
</body>

</html>
